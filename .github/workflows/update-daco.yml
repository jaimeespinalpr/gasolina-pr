name: Scheduled DACO Price Synchronization

on:
  schedule:
    # Run at 5:00 UTC (1:00 AM AST), 13:00 UTC (9:00 AM AST), and 21:00 UTC (5:00 PM AST) every day
    - cron: '0 5,13,21 * * *'
  workflow_dispatch: # Enable manual triggering of updates from GitHub UI

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DACO synchronization script
        run: python3 scripts/update_daco_data.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- daco-data.json; then
            echo "No DACO changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daco-data.json
          git commit -m "chore(daco): automatically synchronize fuel prices [skip ci]"
          git push origin HEAD:main
